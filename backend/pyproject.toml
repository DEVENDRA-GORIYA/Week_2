[project]
name = "helix"
version = "1.0.0"
description = "JWT-protected FastAPI inference gateway for local open models"
requires-python = ">=3.11"
dependencies = [
    "aiosqlite>=0.20",
    "bcrypt>=4.2",
    "email-validator>=2.2",
    "fastapi>=0.115",
    "httpx>=0.27",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "PyJWT>=2.9",
    "sqlalchemy[asyncio]>=2.0.36",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:UserWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
